version: 1

# Spring Boot reads environment variables through relaxed binding:
#   spring.datasource.url  <->  SPRING_DATASOURCE_URL
# The schema always uses the environment variable name.
variables:
  SPRING_DATASOURCE_URL:
    type: url
    required: true
    schemes: [jdbc]
    description: JDBC URL (spring.datasource.url)

  SPRING_DATASOURCE_PASSWORD:
    type: string
    required: true
    secret: true
    description: Database password (spring.datasource.password)

  SERVER_PORT:
    type: port
    default: 8080
    description: HTTP port (server.port)

  SPRING_PROFILES_ACTIVE:
    type: enum
    required: true
    values: [dev, staging, production]
    description: Active profiles (spring.profiles.active)

  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED:
    type: boolean
    default: true
    description: Kubernetes-style health probes
